name: Toolkit regression tests

on:
  push:
    paths:
      - 'osint_tool/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'osint_tool/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r osint_tool/requirements-test.txt
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run -a python -m unittest discover -s tests -v
      - run: node --test tests/web_ui.test.cjs
