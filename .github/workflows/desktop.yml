name: Portable Windows desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['osint_tool/**', 'tests/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['osint_tool/**', 'tests/**', '.github/workflows/desktop.yml']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install test dependencies
        run: python -m pip install -r osint_tool/requirements-test.txt
      - name: Run Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Build in an isolated environment with desktop dependencies only
        shell: pwsh
        run: |
          python -m venv .venv-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .venv-build/Scripts/python.exe -m pip install -r osint_tool/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .venv-build/Scripts/python.exe osint_tool/build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test the packaged EXE from an unrelated working directory
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist/OSINTReconTool.exe'
          $report = Join-Path $env:RUNNER_TEMP 'desktop-smoke.json'
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', $report) -WorkingDirectory $env:RUNNER_TEMP -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Packaged desktop timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Desktop failed: $($process.ExitCode)" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw $result.error }
          Get-Content $report
      - uses: actions/upload-artifact@v4
        with:
          name: OSINTReconTool-Windows-x64
          path: |
            dist/OSINTReconTool-windows-x64.zip
            dist/OSINTReconTool-build.json
          if-no-files-found: error
