name: Publish portable desktop tools
on:
  push:
    branches: [main]
    paths: ['osint_tool/**', 'windows_tools/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-portable-tools
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop build dependencies only
        run: python -m pip install -r osint_tool/requirements-build.txt
      - name: Build desktop-only OSINT package and both Windows utilities
        run: |
          python osint_tool/build.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -File windows_tools/Build.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Validate all three desktop executables before publishing
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'osint-smoke.json'
          $process = Start-Process dist/OSINTReconTool.exe -ArgumentList @('--smoke-test', $report) -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'OSINT smoke timeout' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report) -or -not (Get-Content $report -Raw | ConvertFrom-Json).ok) { throw 'OSINT smoke failed' }
          foreach ($name in @('SecurityDashboard','WindowsDebloat')) {
            $process = Start-Process "dist/windows-tools/$name.exe" -ArgumentList '--self-test' -PassThru
            if (-not $process.WaitForExit(60000)) { $process.Kill(); throw "$name smoke timeout" }
            if ($process.ExitCode -ne 0) { throw "$name smoke failed" }
          }
      - name: Replace existing download URLs with desktop-only packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Copy-Item dist/OSINTReconTool-windows-x64.zip dist/osint_tool.zip
          Copy-Item dist/windows-tools/SecurityDashboard-windows-x64.zip dist/SecurityDashboard.zip
          Copy-Item dist/windows-tools/WindowsDebloat-windows-x64.zip dist/WindowsDebloatSetup.zip
          gh release upload v0.8-alpha dist/osint_tool.zip --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release upload v0.5-alpha dist/SecurityDashboard.zip --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release upload v0.7-alpha dist/WindowsDebloatSetup.zip --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
